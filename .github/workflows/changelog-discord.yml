name: Send Legal Database Changelog to Discord

on:
  push:
    branches:
      - main
    paths:
      - 'Legal Database Changelog'

jobs:
  notify_discord:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract new changelog lines & send to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Pairnei mono tis grammes pou prostethikan (+) sto teleftaio commit
          ADDED_LINES=$(git diff HEAD~1 HEAD -- "Legal Database Changelog" | grep '^+' | grep -v '^+++' | sed 's/^+//')

          # An den prostethike kati neo, stamataei
          if [ -z "$ADDED_LINES" ]; then
            echo "No new lines added."
            exit 0
          fi

          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

          PAYLOAD=$(jq -n \
            --arg content "📢 **Νέο Update — Legal Database Changelog**" \
            --arg title "Τι άλλαξε:" \
            --arg desc "${ADDED_LINES}"$'\n\n'"[Δες την αλλαγή στο GitHub](${COMMIT_URL})" \
            '{
              content: $content,
              embeds: [{
                title: $title,
                description: $desc,
                color: 5793266
              }]
            }')

          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK_URL"
