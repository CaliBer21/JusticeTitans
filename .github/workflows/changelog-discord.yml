name: Update Changelog & Notify Discord

on:
  push:
    branches:
      - main

jobs:
  changelog_and_notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Update CHANGELOG.md
        run: |
          DATE=$(date +'%Y-%m-%d')
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

          NEW_ENTRY="## [${COMMIT_HASH}] - ${DATE}\n- ${COMMIT_MSG} ([view commit](${COMMIT_URL}))\n"

          if [ -f CHANGELOG.md ]; then
            awk -v entry="$NEW_ENTRY" '
              NR==1 { print; print ""; printf "%b", entry; next }
              { print }
            ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
          else
            printf "# Changelog\n\n%b" "$NEW_ENTRY" > CHANGELOG.md
          fi

      - name: Commit and push CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog changes to commit."
          else
            git add CHANGELOG.md
            git commit -m "docs: update CHANGELOG.md [skip ci]"
            git push
          fi

      - name: Send notification to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          AUTHOR=$(git log -1 --pretty=%an)
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

          PAYLOAD=$(jq -n \
            --arg content "📢 **Νέο Update στο \`${{ github.repository }}\`**" \
            --arg title "Αλλαγή από ${AUTHOR}" \
            --arg desc "**Commit:** ${COMMIT_MSG}\n[Δες το commit στο GitHub](${COMMIT_URL})" \
            '{
              content: $content,
              embeds: [{
                title: $title,
                description: $desc,
                color: 5793266
              }]
            }')

          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK_URL"
